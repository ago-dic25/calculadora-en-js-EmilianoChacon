<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .calculadora {
            background: #fffafc;
            border: 2px solid #f2d7ee;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 25px;
            width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #2B50AA;
            margin-bottom: 10px;
        }

        #resultado {
            background: #C9D7F8;
            width: 100%;
            height: 70px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #5a4b81;
            border: 1px solid #d9bfff;
            margin-bottom: 15px;
        }

        .contenedor {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60%;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 10px;
            border: 1px solid #d7c4f3;
            outline: none;
            text-align: center;
            background: #f5f0ff;
            font-size: 16px;
        }

        button {
            background-color: #b4e1ff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            width: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            font-weight: bold;
        }

        button:hover {
            background-color: #a0d8ff;
            transform: scale(1.05);
        }

        #error {
            color: #e57373;
            font-size: 14px;
            margin-top: 5px;
        }

        #log {
            margin-top: 15px;
            background: #f8f1ff;
            border-radius: 10px;
            padding: 10px;
            text-align: left;
            height: 100px;
            overflow-y: auto;
            border: 1px solid #e2c6ff;
            font-size: 14px;
            width: 100%;
        }

        #log h3 {
            font-size: 15px;
            color: black;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #limpiar {
            background-color: #ffd3e0;
            color: #5a4b81;
            font-size: 12px;
            padding: 6px 4px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        #limpiar:hover {
            background-color: #ffbcd0;
        }
    </style>
</head>
<body>

<div class="calculadora">
    <h2>Calculadora</h2>

    <div id="resultado"> </div>
    <div class="contenedor">


        <div class="inputs">
            <input type="number" id="num1" placeholder="Número 1">
            <input type="number" id="num2" placeholder="Número 2">
        </div>
        <div class="botones">
            <button type="button" onclick="operar('+')">+</button>
            <button type="button" onclick="operar('-')">−</button>
        </div>
        <div class="botones">
            <button type="button" onclick="operar('*')">×</button>
            <button type="button" onclick="operar('/')">÷</button>
        </div>
    </div>

    <div id="error"></div>

    <div id="log">
        <h3>
            Historial
            <button id="limpiar" onclick="limpiarHistorial()">Limpiar</button>
        </h3>
        <ul id="historial"></ul>
    </div>
</div>

<script>
    function operar(op) {
        const num1 = document.getElementById("num1").value.trim();
        const num2 = document.getElementById("num2").value.trim();
        const resultado = document.getElementById("resultado");
        const error = document.getElementById("error");
        const historial = document.getElementById("historial");

        resultado.textContent = " ";
        error.textContent = "";

        if (num1 === "" || num2 === "") {
            error.textContent = "Por favor, ingresa ambos números.";
            return;
        }

        const a = parseFloat(num1);
        const b = parseFloat(num2);
        let res;

        switch (op) {
            case '+': res = a + b; break;
            case '-': res = a - b; break;
            case '*': res = a * b; break;
            case '/':
                if (b === 0) {
                    error.textContent = "Error: División entre 0 no permitida.";
                    return;
                }
                res = a / b;
                break;
        }

        resultado.textContent = `${res}`;
        const li = document.createElement("li");
        li.textContent = `${a} ${op} ${b} = ${res}`;
        historial.appendChild(li);
    }

    function limpiarHistorial() {
	document.getElementById("historial").innerHTML = "";
	document.getElementById("num1").value = "";
	document.getElementById("num2").value = "";
	document.getElementById("resultado").textContent = "";
	document.getElementById("error").textContent = "";
    }

</script>

</body>
</html>
